[project]
name = "hermes-thread"
version = "0.1.0"
description = "Session-scoped ask tracking for Hermes Agent"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi"]

[project.optional-dependencies]
test = ["httpx", "pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["db", "filter", "__init__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
