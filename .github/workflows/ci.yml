name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest ruff

      - name: Run tests (hermetic)
        env:
          HERMES_HOME: /tmp/hermes-ci-home
        run: |
          if [ ! -d tests ]; then
            echo "::warning::no tests/ directory present (expected until card 1 merges)"
            exit 0
          fi
          pytest tests/ -v

      - name: Lint (ruff)
        run: ruff check .
