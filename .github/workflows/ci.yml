name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project + test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]" ruff

      - name: Run tests (hermetic)
        env:
          HERMES_HOME: /tmp/hermes-ci-home
        run: pytest tests/ -v

      - name: Lint (ruff)
        run: ruff check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Node tests (if present)
        run: |
          # card 3's fix PR makes this unconditional once a .mjs test lands on main
          shopt -s nullglob
          files=(tests/*.test.mjs)
          if [ ${#files[@]} -gt 0 ]; then
            node --test tests/*.test.mjs
          else
            echo "::notice::no tests/*.test.mjs present yet, skipping Node tests"
          fi
